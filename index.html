<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17221b" />
    <meta name="description" content="Practice chess openings and discover traps at your own pace." />
    <title>Chess Trap Board</title>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="brand"><span class="brand-mark">♞</span><div><strong>CHESS TRAP BOARD</strong><small>OPENING PRACTICE</small></div></div>
        <a class="source-link" href="https://github.com/lzap/chesstrapboard">Source ↗</a>
      </header>
      <main class="play-layout">
        <section class="panel intro-panel" aria-label="Training settings">
          <label class="field-label" for="opening-search">Opening (optional)</label>
          <input id="opening-search" type="search" placeholder="Search name or ECO, e.g. Italian" autocomplete="off" />
          <div id="opening-results" class="opening-results" role="listbox" aria-label="Opening matches"></div>
          <div id="selected-opening" class="selected-opening">Loading opening names…</div>
          <fieldset class="side-picker"><legend>Play as</legend><label><input type="radio" name="side" value="w" checked /> White</label><label><input type="radio" name="side" value="b" /> Black</label></fieldset>
          <label class="check-option" id="evaluation-option"><input id="evaluation-toggle" type="checkbox" /> Show evaluation during play</label>
          <div id="trap-controls" class="trap-controls">
            <label class="field-label" for="difficulty" title="Difficulty changes the engine's thinking time. It is not a measured Elo rating.">Computer difficulty</label>
            <select id="difficulty" title="Difficulty changes the engine's thinking time. It is not a measured Elo rating."><option value="beginner" selected>Beginner · quicker moves</option><option value="intermediate">Intermediate</option><option value="strong">Strong · longer thinking</option></select>
            <label class="field-label setting-label" for="mistake-frequency" title="From its third move, the computer may look for a trap, even during a selected opening. Without a suitable mistake, it follows the line or plays normally. Attempts are spaced apart.">Deliberate mistake attempts</label>
            <select id="mistake-frequency" title="Opportunity checks begin on the computer's third move. Attempts are spaced apart; without a suitable mistake, the computer follows the opening or plays normally."><option value="off">Off</option><option value="rare">Occasional · 25% of eligible turns</option><option value="sometimes">Sometimes · 50%</option><option value="often">Often · 85%</option><option value="almostAlways" selected>Almost always · 95%</option></select>
            <label class="field-label setting-label" for="mistake-size" title="Target advantage after a deliberate CPU mistake: Mild about 0.3–1.0 pawns, Medium 0.6–2.5, Large 1.5–8.0. Engine estimates are not guaranteed.">Opportunity size</label>
            <select id="mistake-size" title="Target advantage after a deliberate CPU mistake: Mild about 0.3–1.0 pawns, Medium 0.6–2.5, Large 1.5–8.0. Engine estimates are not guaranteed."><option value="mild">Mild</option><option value="medium">Medium</option><option value="large" selected>Large</option></select>
          </div>
          <label class="check-option sound-option"><input id="sound-toggle" type="checkbox" checked /> Move sound</label>
          <label class="check-option" id="opportunity-cue-option"><input id="opportunity-cue-toggle" type="checkbox" checked /> Opportunity hint &amp; sound</label>
          <label class="volume-option" for="sound-volume">Sound volume <input id="sound-volume" type="range" min="0" max="100" value="50" /></label>
          <p id="feedback" class="feedback" role="status" aria-live="polite">Loading openings…</p>
        </section>
        <section class="board-column" aria-label="Game">
          <div class="board-top"><span class="board-hint" id="board-hint">Loading openings…</span></div>
          <div id="board-container" class="board-container"></div>
          <div class="board-bottom"><p id="status" role="status" aria-live="polite"></p><button type="button" class="text-button" id="flip-button">↻ Flip board</button></div>
          <div class="action-row"><button type="button" id="new-button" class="button button-primary">New game</button><button type="button" id="finish-button" class="button button-secondary">End game &amp; Analyze</button><button type="button" id="retry-cpu-button" class="button button-secondary" hidden>Retry engine</button></div>
        </section>
        <aside class="panel moves-panel" aria-label="Analysis, moves, and PGN">
          <section id="evaluation-panel" class="evaluation-panel" aria-label="Evaluation">
            <div class="evaluation"><div class="eval-track" role="img" aria-label="Evaluation hidden"><div id="eval-white" hidden></div></div><div><span class="eval-caption">EVALUATION</span><strong id="eval-label"></strong><small>White's perspective</small></div></div>
            <div id="review-detail" class="review-detail"></div>
          </section>
          <div class="panel-heading"><div><p class="eyebrow">GAME RECORD</p><h2>Moves</h2></div><span id="move-count" class="move-count">0 moves</span></div>
          <div id="move-list" class="move-list"></div>
          <div class="pgn-panel"><div class="pgn-actions"><button type="button" id="copy-button" class="button button-secondary">Copy PGN</button><button type="button" id="hint-button" class="button button-secondary" disabled>Hint</button></div><span id="copy-feedback" role="status" aria-live="polite"></span></div>
          <section id="review-panel" class="review-panel" aria-label="Game analysis">
            <p id="review-progress" class="review-progress" role="status" aria-live="polite"></p>
            <progress id="review-meter" max="100" value="0" hidden></progress>
            <button type="button" id="cancel-review" class="text-button" hidden>Cancel review</button>
            <div class="review-navigation"><button type="button" id="review-prev" class="button button-secondary">← Previous</button><span id="review-position">Starting position</span><button type="button" id="review-next" class="button button-secondary">Next →</button></div>
            <p class="navigation-help">Wheel or ←/→: one move · ↑/↓: two</p>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
